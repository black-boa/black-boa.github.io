<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Folios - Inicio de Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Contenedor de toasts -->
  <div id="toast-container"></div>

  <div class="login-page">
    <div class="login-container">
      <div class="login-card">
        <div class="login-logo">
          <div class="logo-icon">📄</div>
          <h1>Control de Folios</h1>
          <p class="login-subtitle">Sistema de seguimiento y control de correspondencia</p>
        </div>

        <form id="loginForm" class="login-form">
          <div class="mb-3">
            <label class="form-label">Número de Empleado</label>
            <input type="text" id="empleado" class="form-control" placeholder="Ej: ADM-001" required autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="Contraseña" required autocomplete="current-password">
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-login">Iniciar Sesión</button>
          </div>
        </form>

        <div class="login-info mt-4">
          <strong>Cuentas de prueba</strong> (contraseña libre):
          <br>ADM-001 · SEC-001 · LS-001 · LD-001 · LJ-001 · SOL-001
        </div>
      </div>
    </div>

    <div class="login-footer">
      Secretaría de Pesca y Acuacultura del Pueblo (SPyAP) · Chiapas, México
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
