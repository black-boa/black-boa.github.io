<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Folios - Consulta General</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Contenedor de toasts -->
  <div id="toast-container"></div>

  <nav class="navbar-asiste">
    <div class="logo-icon">📄</div>
    <a class="navbar-brand" href="dashboard-visor-general.html">
      <span>
        <span class="brand-title d-block">Control de Folios</span>
        <span class="brand-subtitle">SPyAP · Visor General</span>
      </span>
    </a>
    <div class="user-info">
      <div class="navbar-user">
        <div class="navbar-avatar-iniciales" id="avatar-iniciales"></div>
        <div class="navbar-user-info">
          <span class="navbar-user-nombre" id="nombre-usuario"></span>
          <span class="navbar-user-area" id="area-usuario"></span>
          <span class="rol-badge" id="rol-badge"></span>
        </div>
      </div>
      <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </nav>

  <div class="container-admin pt-4 pb-4">
    <h1 class="page-title">Consulta General de Oficios</h1>

    <div class="filters-section">
      <div class="filter-row">
        <div class="filter-group">
          <label class="form-label">Tipo de oficio</label>
          <select class="form-select" id="filtro-tipo">
            <option value="">Todos los tipos</option>
            <option value="oficio">Oficio</option>
            <option value="memorandum">Memorandum</option>
            <option value="circular">Circular</option>
            <option value="incidencias">Incidencias</option>
            <option value="memorandum_comision">Memorandum de Comisión</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="form-label">Folio</label>
          <input type="text" class="form-control" id="filtro-folio" placeholder="SPyAP/...">
        </div>
        <div class="filter-group">
          <label class="form-label">Área / Sigla</label>
          <input type="text" class="form-control" id="filtro-area" placeholder="Ej: DG">
        </div>
        <div class="filter-group">
          <label class="form-label">Estatus</label>
          <select class="form-select" id="filtro-estatus">
            <option value="">Todos</option>
            <option value="Pendiente">Pendiente</option>
            <option value="Liberado">Liberado</option>
            <option value="Cancelado">Cancelado</option>
          </select>
        </div>
        <div class="filter-group">
          <button type="button" class="btn btn-asiste-primary" onclick="aplicarFiltros()">Filtrar</button>
        </div>
      </div>
    </div>

<div class="card-asiste">
      <div class="card-header-asiste">
        <h3 class="card-title-asiste">Oficios registrados</h3>
          <span class="badge text-primario">Total: <span id="total-mostrados">0</span></span>
        </div>
        <div class="table-responsive">
          <table class="table-asiste">
            <thead>
              <tr>
                <th>Folio</th>
                <th>Tipo</th>
                <th>Área</th>
                <th>Asunto</th>
                <th>Solicitante</th>
                <th>Estatus</th>
                <th>Fecha Solicitud</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-oficios"></tbody>
          </table>
        </div>
      </div>

      <!-- Calendario de folios -->
      <div class="card-asiste cal-folios-card">
        <div class="card-header-asiste">
          <h3 class="card-title-asiste">Calendario de folios por día</h3>
        </div>
        <div class="cal-folios-contenedor" id="calendario-folios"></div>
      </div>
  </div>

  <!-- Modal de detalle del folio -->
  <div class="modal fade" id="modalDetalleFolio" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header modal-header-asiste">
          <h5 class="modal-title" id="detalle-titulo">Detalle del folio</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="detalle-contenido"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-asiste-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-asiste">
    Secretaría de Pesca y Acuacultura del Pueblo (SPyAP) · Control de Folios
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const session = sesionVigente({ permiso: 'consultar_oficios', mensaje: 'No tiene permiso para ver oficios' });
      if (!session) return;
      pintarUsuario(session);
      cargarOficios();
      renderCalendarioFolios('calendario-folios');

      document.getElementById('filtro-folio').addEventListener('input', aplicarFiltros);
      document.getElementById('filtro-tipo').addEventListener('change', aplicarFiltros);
      document.getElementById('filtro-area').addEventListener('input', aplicarFiltros);
      document.getElementById('filtro-estatus').addEventListener('change', aplicarFiltros);
    });

    function cargarOficios() {
      const oficios = getOficios();
      const tbody = document.getElementById('tabla-oficios');
      const totalSpan = document.getElementById('total-mostrados');
      const tipo = NOMBRES_OFICIO;
      const tipos = TODAS_LAS_TABLAS;
      let filas = [];

      tipos.forEach(tabla => {
        (oficios[tabla] || []).forEach(f => {
          filas.push({ tabla, f });
        });
      });

      const folioFiltro = (document.getElementById('filtro-folio').value || '').trim().toLowerCase();
      const tipoFiltro = document.getElementById('filtro-tipo').value;
      const areaFiltro = (document.getElementById('filtro-area').value || '').trim().toLowerCase();
      const estatusFiltro = document.getElementById('filtro-estatus').value;

      filas = filas.filter(({ tabla }) => !tipoFiltro || tabla === TIPOS_OFICIO[tipoFiltro]);
      if (folioFiltro) filas = filas.filter(({ f }) => (f.folio || '').toLowerCase().includes(folioFiltro));
      if (areaFiltro) {
        filas = filas.filter(({ f }) => {
          const siglaArea = getSiglaByAreaId(f.id_area) || (f.folio || '').split('/')[0] || '';
          const nombreArea = getAreaNameById(f.id_area) || '';
          return siglaArea.toLowerCase().includes(areaFiltro) || nombreArea.toLowerCase().includes(areaFiltro);
        });
      }
      if (estatusFiltro) filas = filas.filter(({ f }) => f.estatus === estatusFiltro);

      tbody.innerHTML = '';
      filas.forEach(({ tabla, f }) => {
        const fechaSolicitud = f.fecha_solicitud ? presentarFecha(f.fecha_solicitud) : 'N/A';
        const fechaDocumento = f.fecha_documento ? presentarFecha(f.fecha_documento) : 'N/A';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${escapeHtml(f.folio)}</strong></td>
          <td><span class="badge bg-primario text-capitalize">${escapeHtml(tipo[tabla] || tabla)}</span></td>
          <td>${escapeHtml(getAreaNameById(f.id_area))}</td>
          <td>${escapeHtml(f.asunto ? f.asunto.substring(0, 40) : 'Sin asunto')}</td>
          <td>${escapeHtml(f.id_usuario_solicitante ? (f.nombre_solicitante || 'Usuario ' + String(f.id_usuario_solicitante).substring(0, 8)) : 'N/A')}</td>
          <td>${badgeEstatus(f.estatus)}</td>
          <td>${fechaSolicitud}</td>
          <td class="text-end">
            <button type="button" class="btn btn-asiste-primary btn-sm" onclick="verDetalle('${escapeJs(tabla)}', '${escapeJs(String(f.folio))}')">Ver detalle</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      if (filas.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-secondary">No hay oficios que coincidan con los filtros</td></tr>`;
      }
      totalSpan.textContent = filas.length;
    }

    function verDetalle(tabla, folio) {
      const oficios = getOficios();
      const registro = (oficios[tabla] || []).find(f => String(f.folio) === String(folio));
      if (!registro) {
        showToast('No se encontró el folio', 'danger');
        return;
      }

      const fechaSolicitud = registro.fecha_solicitud ? presentarFecha(registro.fecha_solicitud) : 'N/A';
      const fechaDocumento = registro.fecha_documento ? presentarFecha(registro.fecha_documento) : 'N/A';

      document.getElementById('detalle-titulo').textContent = 'Detalle del folio ' + registro.folio;
      document.getElementById('detalle-contenido').innerHTML = `
        <div class="table-responsive">
          <table class="table table-sm detalle-folio-table">
            <tbody>
              <tr><th>Folio</th><td><strong>${escapeHtml(registro.folio)}</strong></td></tr>
              <tr><th>Tipo de oficio</th><td>${escapeHtml(NOMBRES_OFICIO[tabla] || tabla)}</td></tr>
              <tr><th>Área</th><td>${escapeHtml(getAreaNameById(registro.id_area))} <span class="badge-status badge-en-atencion">${escapeHtml(getSiglaByAreaId(registro.id_area) || '')}</span></td></tr>
              <tr><th>Asunto</th><td>${escapeHtml(registro.asunto || 'Sin asunto')}</td></tr>
              <tr><th>Solicitante</th><td>${escapeHtml(registro.nombre_solicitante || 'N/A')}</td></tr>
              <tr><th>Fecha del documento</th><td>${fechaDocumento}</td></tr>
              <tr><th>Fecha de solicitud</th><td>${fechaSolicitud}</td></tr>
              <tr><th>Estatus</th><td>${badgeEstatus(registro.estatus)}</td></tr>
            </tbody>
          </table>
        </div>
      `;

      const modalEl = document.getElementById('modalDetalleFolio');
      const modal = new bootstrap.Modal(modalEl);
      modal.show();
    }

    function aplicarFiltros() {
      cargarOficios();
    }

  </script>
</body>
</html>
